# RFC-0001's dependency rule, made mechanical:
#
#     groups depend downward on Support only; no cross-group imports
#
# Stated in RFC-0001 §Decision and named there as "enforced by `deptrac` in CI" — but nothing
# enforced it until this file landed (roadmap item 3.6). The CI `layering` job has been
# self-skipping on the absence of this exact filename since item 1.9; adding it turns the job on.
#
# Layers are collected by **directory**, not by class-name pattern, because RFC-0001 §Placement
# notes (A-9) fixes the mapping to the source tree itself: "the deptrac layer globs are defined
# against that exact tree, with the group directories (`Dto/`, `Container/`, …) case-exact below
# it". A `classLike` regex would re-state the same grouping in a second, drift-prone vocabulary.
#
# Note that deptrac's `directory` collector compiles its value as a **case-insensitive** regex
# (`#...#i`, see `DefaultBehavior/Layer/DirectoryCollector.php`), so this file cannot itself be
# what enforces RFC-0001's "case-exact" wording — `tools/consistency_lint.py` owns that, and the
# PSR-4 autoloader would fail loudly on a case mismatch long before deptrac ran.
#
# Only `src/main` is analysed. Tests and benchmarks legitimately reach across every group (a DTO
# test constructs DTOs and asserts on Support exceptions; a benchmark hydrates a DTO), so holding
# them to a production layering rule would report violations that are not violations.
deptrac:
  paths:
    - ./src/main/php/d4np/utils

  layers:
    # The six component groups of RFC-0001's table, in its order.
    - name: Dto
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Dto/.*
    - name: Container
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Container/.*
    - name: Database
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Database/.*
    - name: Security
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Security/.*
    - name: Http
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Http/.*
    - name: Errors
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Errors/.*

    # The layer every group is allowed to depend on, and which may depend on none of them.
    - name: Support
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Support/.*

    # The one sanctioned third-party dependency in production code (spec FR-09b: RFC-0001 requires
    # rich-HTML sanitization be *delegated*, and names the delegate). Declared as its own layer
    # rather than waved through as "vendor code", so that the ruleset below can say which group is
    # allowed to reach it — today only `Security`. An import of it from `Dto` or `Http` would be a
    # violation here rather than a silent new coupling to an optional package.
    - name: HtmlSanitizer
      collectors:
        - type: classLike
          # Doubled backslashes: this is a PCRE pattern, and a single `\C`/`\H` would be read as a
          # regex escape sequence rather than a namespace separator.
          value: ^Symfony\\Component\\HtmlSanitizer\\.*

    # The interface-only PSR packages. RFC-0001 R-3 carves these out of spec NFR-08's
    # "no third-party implementation dependencies": a package that *implements* PSR-11 or PSR-3
    # necessarily requires the interface package, so they are required rather than optional. They
    # get a layer for the same reason `HtmlSanitizer` does — so that which groups may reach them is
    # a stated rule rather than an accident. Unlike the sanitizer, more than one group legitimately
    # needs them (`Security` logs, `Errors` will implement PSR-3, `Container` will implement
    # PSR-11), so the ruleset below grants them individually as each group arrives.
    - name: Psr
      collectors:
        - type: classLike
          # Doubled backslashes: a PCRE pattern, where a single `\L` would be a regex escape.
          value: ^Psr\\(Log|Container)\\.*

    # The PSR-7 bridge (ADR-0033), whose source lives in `packages/utils-psr7-bridge/` and is
    # therefore outside `paths` above — deptrac never analyses it. This layer exists to constrain
    # the *other* direction: it is collected by class name so that a core file importing
    # `D4np\Utils\Bridge\…` lands in a declared layer, and the empty ruleset entry below then makes
    # that import a **violation** rather than an "uncovered dependency" nobody reads.
    #
    # The dependency direction is one-way by design: the bridge depends on the core's public API,
    # and the core must never learn that the bridge exists — that is what keeps `psr/http-message`
    # out of the core's requirements (NFR-08) and the bridge optional (imported ADR-002).
    - name: Bridge
      collectors:
        - type: classLike
          value: ^D4np\\Utils\\Bridge\\.*

    # `Version` sits at the namespace root, in no group — it is a single version constant. Given
    # its own layer rather than left uncollected so that "every production class belongs to a
    # declared layer" stays a fact this config states, rather than an assumption.
    - name: Version
      collectors:
        - type: directory
          value: src/main/php/d4np/utils/Version\.php

  ruleset:
    # Each group may reach downward into Support, and nowhere else. Adding a group to any of
    # these lists is exactly the cross-group import RFC-0001 forbids.
    Dto:
      - Support
    Container:
      - Support
      # The Container implements PSR-11, and its exceptions implement PSR-11's own exception
      # interfaces (spec FR-04, imported ADR-001). Those exceptions live in this group rather than
      # in Support with the rest of the hierarchy precisely so this grant stays here: Support
      # depends on nothing, and that must not change to accommodate one class (ADR-0028).
      - Psr
    Database:
      - Support
    Security:
      - Support
      # Only this group may reach the optional sanitizer (spec FR-09b).
      - HtmlSanitizer
      # Hash logs its bcrypt-fallback WARNING through PSR-3 (spec FR-11).
      - Psr
    Http:
      - Support
    Errors:
      - Support
      # `Logger` implements PSR-3 and `ExceptionHandler` accepts one (spec FR-17, FR-18).
      - Psr

    # Support is the bottom of the library: it depends on no group. An empty list here is the
    # load-bearing half of the rule — it is what makes a Support -> Dto import (the inversion
    # ADR-0010 had to design around for `ParameterMetadata::$attributes`) a build failure rather
    # than a code-review opinion.
    Support: ~

    # A version constant depends on nothing.
    Version: ~

    # A vendored dependency is a leaf here: this repository does not constrain its internals.
    HtmlSanitizer: ~
    Psr: ~

    # No group may reach the bridge. Absent from every ruleset above AND declared empty here, so a
    # core -> Bridge import is a violation from both directions of deptrac's bookkeeping. This is
    # the same shape as `Support: ~`, and load-bearing for the same reason: it is what makes the
    # bridge's optionality a build property rather than a promise in an ADR.
    Bridge: ~
