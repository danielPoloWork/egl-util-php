name: nightly

# Spec NFR-06 asks for a *nightly* benchmark run, and it earns its place by catching two things
# the per-PR gate in `ci.yml` structurally cannot.
#
# 1. **Slow drift.** The per-PR gate compares HEAD against its base, so twenty commits at +9% each
#    pass every one of its checks and still double the runtime. The absolute NFR ceilings are what
#    notice that, and here they run against no baseline at all.
# 2. **Change that arrives without a commit.** The runner image itself moves under this job
#    (a new PHP point release, a new `ubuntu-24.04` snapshot), so a subject that got slower
#    shows up here even on a week with no pushes — `composer install` reads the committed
#    `composer.lock`, so this axis is the environment, never a re-resolved dependency version.
#
# What this deliberately does NOT do is compare against a stored baseline from a previous night.
# Measured: across nine `master` runs where the subject's code was provably unchanged, one
# benchmark ranged 2.684-3.767us — 40.4% peak to peak on GitHub's shared runners. A 10%
# night-to-night comparison would report a regression most nights and mean nothing. The per-PR gate
# gets its 10% threshold honestly by measuring both sides on the same runner; this one does not
# pretend to.

on:
  schedule:
    # 03:17 UTC. Not on the hour: GitHub's scheduler queues heavily at :00, and a benchmark that
    # waits in a queue is a benchmark measuring a busier machine.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  benchmarks:
    name: nightly / NFR budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'   # spec NFR-06 benchmark methodology
          coverage: none       # instrumentation would distort the measurements
          ini-values: opcache.enable_cli=0, opcache.jit=disable, opcache.jit_buffer_size=0

      - name: Assert the measurement environment matches NFR-06
        run: php tools/assert_bench_env.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run the benchmark suite
        run: |
          mkdir -p build/logs
          vendor/bin/phpbench run --report=aggregate --dump-file=build/logs/nightly.xml

      - name: Absolute NFR budgets
        run: |
          python3 tools/bench_budget_gate.py build/logs/nightly.xml \
            --budget benchHydrateWarm=5 \
            --budget benchBuildFiveConditionSelect=10 \
            --budget benchWarmSingletonResolve=2 \
            --budget benchFirstAutowiredResolve=30 \
            --budget benchSequenceNext=450 \
            --budget benchWriteTenThousandByTen=150000 \
            --budget benchDispatchLastOfFiftyRoutes=15 \
            --budget benchEnvelopeBuild=2 \
            --budget benchSuppressedRecord=0.5 \
            --budget benchCryptoRoundTrip=60 \
            --budget benchUlid=10 \
            --budget benchUuidV7=10

      - name: NFR-01 ratio — hydration vs manual construction
        run: |
          python3 tools/bench_ratio_gate.py build/logs/nightly.xml \
            --numerator benchHydrateWarm --denominator benchManualConstruction --max-ratio 3

      # Item 10.6 wired this ratio into ci.yml but not here, so NFR-09 was the one ratio budget
      # with no nightly watch. Added at item 10.10 alongside its revision (ADR-0046), since a
      # nightly re-resolve of dependencies is exactly how a ratio drifts without any commit.
      - name: NFR-09 ratio — gateway fetch+normalize+hydrate vs hand-written PDO
        run: |
          python3 tools/bench_ratio_gate.py build/logs/nightly.xml \
            --numerator benchGatewayFetchNormalizeHydrate \
            --denominator benchHandWrittenPdoLoop --max-ratio 2.5

      - name: Keep the report as the night's record
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nightly-benchmark-${{ github.run_number }}
          path: build/logs/nightly.xml
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Taint analysis (issue #103, ADR-0073).
  #
  # PHPStan at max level carries real security weight in this library -- `SqlStatement::literal()`
  # takes a `literal-string`, which is a *proof* that no runtime value is in that SQL text -- but
  # PHPStan does not do taint tracking. It can say "this string is a literal"; it cannot say "this
  # string came from `$_GET` and reached `PDO::prepare()` eleven calls later." Psalm can, and this
  # job asks it, across Database, Http and Mail.
  #
  # Nightly rather than per-PR, per the issue's "advisory at first". Nothing here blocks a merge --
  # which is what "advisory" means -- but the job itself goes RED on any flow not in the triaged
  # baseline, because a scheduled job that reports findings without failing is one nobody reads.
  # Promoting it to a PR gate is a later decision the mechanism already supports: it exits non-zero
  # today.
  #
  # Psalm is pinned to ^5.26, not 6.x, and the reason is reproducibility rather than caution:
  # Psalm 6 requires PHP >= 8.3.16, which the maintainer's machine does not have, so a 6.x baseline
  # could be generated in CI and never re-triaged by hand. A baseline nobody can regenerate where
  # they can read the code is a baseline that rots. Revisit when the local floor moves.
  # ---------------------------------------------------------------------------
  taint:
    name: nightly / taint analysis (Psalm)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Self-enables on the config, the same L-0010 guard `layering`, `mutation` and `benchmark`
      # use: the job is inert until the config lands and needs no edit here when it does.
      - name: Check for the taint config (job self-enables when it lands)
        id: cfg
        shell: bash
        run: |
          if [ -f psalm-taint.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Taint analysis pending::No psalm-taint.xml yet, so the taint job is skipped."
          fi

      - name: Set up PHP
        if: steps.cfg.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # The project's own dependencies, because psalm-taint.xml points `autoloader` at
      # vendor/autoload.php -- Psalm resolves this library's classes through it.
      - name: Install this package's own dependencies
        if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Install Psalm outside this package's dependency graph
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taint-tool"
          # ADR-0031/ADR-0040's pattern and ADR-0031's reason: constrained rather than floating,
          # because a tool that changes its own findings between runs makes a baseline
          # unreviewable -- and this project's floor is PHP 8.1, which Psalm's own floor exceeds.
          composer require --working-dir="$RUNNER_TEMP/taint-tool" \
            --no-interaction "vimeo/psalm:^5.26"

      - name: Source-to-sink taint analysis against the triaged baseline
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          # --no-cache is deliberate: a cache carried between nights is one more way a run could
          # go green having re-analysed nothing, and a fresh runner has nothing to reuse anyway.
          # The baseline and its unused-entry check both come from psalm-taint.xml, so this
          # command and the one in docs/security/taint-analysis.md are the same command.
          php "$RUNNER_TEMP/taint-tool/vendor/bin/psalm" \
            --config=psalm-taint.xml \
            --taint-analysis \
            --no-cache \
            --no-progress \
            --report=build/logs/taint.json

      - name: Keep the taint report
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: taint-report-${{ github.run_number }}
          path: build/logs/taint.json
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Full-tree mutation score, ADVISORY (issue #108, ADR-0074).
  #
  # `ci.yml`'s `mutation` job gates three namespaces — `Security`, `Database`, `Dto` — at NFR-07's
  # >= 70% floor, and those three are the spec's own scope, not a convenience. Issue #108 asks
  # whether `Persistence` (data-mapping, injection-adjacent per its own gateway injection suite)
  # and `Http` (CSRF comparison, router) should join them.
  #
  # ADR-0040 already settled who answers that: *"the spec owns the number ... a change to it is a
  # spec amendment with its own reasoning, not a side effect of the run that first measured it."*
  # So this job measures and does not gate. `--min-msi=0` is the honest spelling of that: the score
  # can be anything and this job will not fail for it.
  #
  # What it DOES fail on is being unable to produce a number. `tools/mutation_scope_report.py`
  # exits non-zero on a missing, unparseable or empty log, and — the check that matters — when its
  # own re-implementation of Infection's MSI formula disagrees with the `stats.msi` Infection
  # wrote. A table of plausible, wrong per-namespace numbers is exactly what a maintainer would
  # then set a spec floor from, so the run refuses rather than prints it.
  #
  # Nightly rather than per-PR because it mutates the whole tree: strictly more work than the
  # gating run, for information nobody needs at merge time.
  # ---------------------------------------------------------------------------
  mutation-scope:
    name: nightly / full-tree mutation score (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the full-tree config (job self-enables when it lands)
        id: cfg
        shell: bash
        run: |
          if [ -f infection-fulltree.json5 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Full-tree mutation pending::No infection-fulltree.json5 yet, so the advisory mutation job is skipped."
          fi

      - name: Set up PHP
        if: steps.cfg.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov   # Infection needs a coverage driver; this is the measurement, not a budget

      - name: Install dependencies
        if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist

      - name: Install Infection outside this package's dependency graph
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-tool"
          # ADR-0040's arrangement and ADR-0031's constraint, both unchanged: Infection's PHP floor
          # is above this library's 8.1, and a tool that changes its own findings between runs
          # makes a measurement unreviewable. `--no-plugins` because infection/extension-installer
          # would otherwise want an allow-plugins prompt.
          composer require --working-dir="$RUNNER_TEMP/mutation-tool" \
            --no-interaction --no-plugins "infection/infection:^0.34"

      - name: Measure the full tree (advisory — the score never fails this job)
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          # --min-msi=0 states the advisory posture in the command rather than leaving it to a
          # comment: there is no floor here to fail against, deliberately.
          php "$RUNNER_TEMP/mutation-tool/vendor/bin/infection" \
            --configuration=infection-fulltree.json5 \
            --min-msi=0 \
            --no-progress \
            --no-interaction \
            -j2

      - name: Split the result per namespace
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          # This is the step that can fail, and the only one that should: it refuses a log it
          # cannot read, and refuses its own arithmetic when that disagrees with Infection's.
          python3 tools/mutation_scope_report.py build/logs/infection-fulltree.json \
            | tee build/logs/mutation-scope.txt

          {
            echo "### Full-tree mutation score, per namespace (advisory)"
            echo
            echo '```'
            cat build/logs/mutation-scope.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full-tree reports
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mutation-fulltree-${{ github.run_number }}
          path: build/logs/infection-fulltree*
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Scheduled composer audit (issue #98, ADR-0076).
  #
  # `ci.yml`'s `hygiene` job already runs `composer audit`, but only on a push or a PR diff — a CVE
  # published against an already-vendored dependency during a quiet week (no commits, no PRs) goes
  # unnoticed until the next one lands, whenever that is. This job asks the same question on a fixed
  # clock instead of on a diff, so the answer no longer depends on there being a reason to ask it.
  # ---------------------------------------------------------------------------
  audit:
    name: nightly / composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # The committed `composer.lock` is what a consumer would actually get, so this audits it
      # rather than a freshly re-resolved tree — the same lock `ci.yml`'s per-push audit reads.
      - name: composer audit
        run: composer audit
