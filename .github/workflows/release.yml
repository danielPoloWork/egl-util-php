name: release

# Release workflow for egl-util-php.
#
# Fires on an annotated SemVer tag push and prepares a *draft* GitHub Release. Publishing stays the
# deliberate human checkpoint (AGENTS.md §11 / docs/workflow/release.md) — nothing here publishes.
#
# Item 7.3 turned this from "draft whatever was tagged" into a gate, because a tag is the one
# artifact that cannot be corrected in place once it is published and consumed. Three things are
# verified before a draft exists at all:
#
#   1. the tag is **annotated and signed** — the supply-chain half;
#   2. the tag **agrees with the tree it points at** (tools/release_gate.py);
#   3. the tagged tree **passes the test suite on every supported PHP**.
#
# The matrix below is a correction, not an addition. The generated version of this file referenced
# `matrix.toolchain` inside a job that declared **no matrix**, so the expression silently fell
# through to '8.3' — the same rendering artifact roadmap item 1.9 fixed in ci.yml's benchmark job
# and which was left uncorrected here. The expression was written for a matrix, so the matrix is
# restored rather than the expression hardcoded: a tag can be pushed at a commit CI never ran, and
# 8.1 is a supported runtime.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Supply-chain and consistency checks. Cheap, and they run once.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: verify ${{ github.ref_name }} is signed and consistent
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: This tag must belong to the core, not the bridge
        shell: bash
        run: |
          # First, and before anything costs an API call. The bridge publishes from
          # `utils-psr7-bridge-vX.Y.Z` (ADR-0033 §3), and both workflows guard their own ref shape
          # rather than trusting GitHub's `tags:` glob to have kept the two grammars apart — a
          # matcher's behaviour is a dependency like any other, and this one cannot be tested
          # without pushing throwaway tags to a public repository (ADR-0035).
          if ! printf '%s' "${{ github.ref_name }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Not a core release tag::${{ github.ref_name }} is not vMAJOR.MINOR.PATCH. A bridge release is utils-psr7-bridge-vMAJOR.MINOR.PATCH and belongs to bridge-release.yml."
            exit 1
          fi

      - name: The tag must be annotated, not lightweight
        shell: bash
        run: |
          TYPE="$(git cat-file -t "${{ github.ref_name }}")"
          echo "git object type for ${{ github.ref_name }}: $TYPE"
          if [ "$TYPE" != "tag" ]; then
            echo "::error title=Lightweight tag::${{ github.ref_name }} is a $TYPE, not an annotated tag. A lightweight tag carries no tagger, no date and no message, and cannot carry a signature. Re-create it with 'git tag -a -s'."
            exit 1
          fi

      - name: The tag must be signed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Asked of GitHub rather than verified locally: GitHub already holds the maintainer's
          # public keys, so this needs no key material on the runner and no keyring to keep in step
          # with a rotation. GitHub is the trust root for the rest of this workflow anyway.
          SHA="$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq '.object.sha')"
          VERIFIED="$(gh api "repos/${{ github.repository }}/git/tags/$SHA" --jq '.verification.verified')"
          REASON="$(gh api "repos/${{ github.repository }}/git/tags/$SHA" --jq '.verification.reason')"
          echo "signature verified: $VERIFIED (reason: $REASON)"
          if [ "$VERIFIED" != "true" ]; then
            echo "::error title=Unsigned or unverifiable tag::${{ github.ref_name }} reports verified=$VERIFIED, reason '$REASON'. A release tag is a supply-chain assertion about who cut it; an unsigned one asserts nothing. Sign with 'git tag -a -s v<X.Y.Z>' using a key registered on your GitHub account, then delete and re-push the unpublished tag."
            exit 1
          fi

      - name: The tag must agree with the tree it points at
        run: python3 tools/release_gate.py --tag "${{ github.ref_name }}"

      - name: The repository's own consistency invariants must hold at the tag
        run: python3 tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # A tag can be pushed at a commit CI never ran, so the tagged tree is tested here on every
  # supported runtime rather than trusted because a PR was once green.
  # ---------------------------------------------------------------------------
  test-tagged-tree:
    name: test ${{ github.ref_name }} on ${{ matrix.toolchain }}
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [php-8.1, php-8.2, php-8.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.toolchain == 'php-8.1' && '8.1' || matrix.toolchain == 'php-8.2' && '8.2' || '8.3' }}
          # No instrumentation: the coverage floor is ci.yml's gate, and pcov here would only slow
          # a job that is confirming the tag builds and passes.
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify the optimized autoloader builds
        run: composer dump-autoload --optimize

      - name: Test suite
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Draft only. The maintainer presses Publish (AGENTS.md §11).
  # ---------------------------------------------------------------------------
  draft-release:
    name: draft GitHub Release for ${{ github.ref_name }}
    needs: [verify-tag, test-tagged-tree]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Declared on the job rather than raised workflow-wide, so `verify-tag` and the tagged-tree
    # matrix keep the narrower default. A job-level block REPLACES the workflow-level one rather
    # than merging with it, which is why `contents: write` is restated here — dropping it would
    # leave this job unable to draft the Release it exists to draft.
    permissions:
      contents: write      # draft the GitHub Release
      id-token: write      # the OIDC token the attestation is signed against
      attestations: write  # write the attestation into this repository's store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The notes carry RELATIVE links, written against docs/releases/. A Release body is not
      # served from that directory, so publishing the file verbatim would ship links that do not
      # resolve -- and the v1.0.0 body a human published by hand carries absolute blob/<tag> URLs,
      # a conversion nothing in this repository performed. This step performs it, so the drafted
      # body and the reviewed body are the same text. It refuses (exit 2) on a dangling link
      # rather than publishing a 404 to every consumer.
      - name: Render the Release body from the notes
        shell: bash
        run: |
          python tools/release_body.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            > "$RUNNER_TEMP/release-body.md"
          echo "::notice title=Release body::Rendered $(wc -l < "$RUNNER_TEMP/release-body.md") lines from docs/releases/${{ github.ref_name }}.md with relative links rebased to this tag."

      # SBOM (issue #98, ADR-0076). `cyclonedx/cyclonedx-php-composer` is a Composer plugin, not a
      # standalone analyser — it reads *this* project's own `vendor/composer/installed.json`, so
      # unlike Psalm/Infection it cannot be installed outside the dependency graph. Its `php ^8.1`
      # floor matches this library's own floor exactly, so it carries no lowest-deps conflict and
      # sits in `require-dev` like any other dev tool.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # --omit=dev: the SBOM describes what a consumer installs, not this repository's own
      # tool-chain — dev-only packages (PHPStan, PHP-CS-Fixer, the SBOM generator itself, ...)
      # never reach a consumer's vendor/ and have no place asserting supply-chain provenance here.
      - name: Generate the CycloneDX SBOM
        run: composer CycloneDX:make-sbom --output-format=XML --output-file="$RUNNER_TEMP/bom.xml" --omit=dev

      # Attest the SBOM (issue #115 criterion 3, ADR-0084).
      #
      # An SBOM is a supply-chain *claim*, and an unattested one attached to a Release is a claim
      # anybody with write access to that Release can replace, with no way for a consumer to tell.
      # This produces a signed SLSA provenance attestation tied to this workflow, this commit and
      # this runner, verifiable with `gh attestation verify bom.xml --repo <owner/name>`.
      #
      # WHAT THIS DOES NOT COVER, because overclaiming here would be worse than not doing it: the
      # artifact a consumer actually installs is the zip **Packagist builds from the tag**, which
      # this workflow does not produce and therefore cannot attest. The assurance for that remains
      # the signed tag — issue #115's first criterion, and the maintainer's to complete. This closes
      # the link for the one artifact this pipeline does build.
      #
      # Placed BEFORE the draft, so it fails closed: a release whose SBOM could not be attested
      # produces no draft at all rather than a published-but-unverifiable asset. That is ADR-0032's
      # posture for everything else on this path.
      - name: Attest the SBOM's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/bom.xml

      - name: Draft the release (a human publishes it)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          # The rendered notes are the substance; GitHub's generated list is appended context.
          # release_gate.py has already asserted the source file exists, so a missing one fails
          # earlier and with a better message than this action would give.
          body_path: ${{ runner.temp }}/release-body.md
          files: ${{ runner.temp }}/bom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where Packagist comes in
        shell: bash
        run: |
          # Packagist is NOT published from here, and that is deliberate rather than unfinished.
          # It mirrors this repository through its own GitHub integration: the tag push updates the
          # package with no token held in this workflow, which is one fewer publishing credential to
          # keep. An explicit API call would also cross AGENTS.md §11's line — the agent drafts, the
          # maintainer publishes — while adding nothing the integration does not already do.
          echo "::notice title=Packagist::Packagist updates itself from this tag push via the repository's GitHub integration, so nothing here holds a Packagist token. After publishing the draft, confirm at https://packagist.org/packages/egl/utils that ${{ github.ref_name }} is listed. The one-time integration setup is a maintainer task — see docs/workflow/release.md."
