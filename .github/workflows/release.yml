name: release

# Release workflow for egl-util-php, generated by EADOS.
# Fires on an annotated SemVer tag push and prepares a *draft* GitHub Release. Publishing is
# the deliberate human checkpoint (AGENTS.md §11 / docs/workflow/release.md) — this workflow
# never publishes, it only drafts so a maintainer can review and press "Publish".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

# Serialize per-tag, but NEVER cancel an in-flight release — a half-run publish is worse
# than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: draft GitHub Release for ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.toolchain == 'php-8.1' && '8.1' || matrix.toolchain == 'php-8.2' && '8.2' || '8.3' }}
          coverage: pcov
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build (verify the tag builds clean)
        shell: bash
        run: composer install --optimize-autoloader

      - name: Draft the release (a human publishes it)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
