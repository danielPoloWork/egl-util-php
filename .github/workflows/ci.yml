name: ci

# Enterprise CI gate for egl-util-php, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on master (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for. The moment `composer.json` exists
  # every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the build system in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "composer.json" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::composer.json is not present yet, so the toolchain jobs are skipped. They start running by themselves once roadmap item 1.1 lands the build system."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: php-8.1, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.2, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.3, preset: default }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.toolchain == 'php-8.1' && '8.1' || matrix.toolchain == 'php-8.2' && '8.2' || '8.3' }}
          # No coverage driver here on purpose. This job never passed a --coverage flag, so pcov
          # was loaded and never used — overhead that also made the matrix *look* like it was
          # measuring a floor nothing compared (roadmap 2.7). Coverage is measured once, in the
          # `coverage` job below.
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build
        shell: bash
        run: composer install --optimize-autoloader

      - name: Test
        shell: bash
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The action-pin step resolves each version comment against its upstream repository, so it
    # needs the API. GITHUB_TOKEN is read-only here (`permissions: contents: read` above) and
    # only lifts the unauthenticated rate limit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py
      # ADR-0003's gate. Runs WITH --verify-upstream: the offline half only checks the pin
      # shape, and a version comment that lies is invisible to any purely local check when the
      # error is applied uniformly. CI is where the truthful half must run.
      - name: Enforce the CI action-pinning policy (ADR-0003)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/action_pin_lint.py --verify-upstream

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / cs-fixer + phpstan
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse
  hygiene:
    name: quality / composer normalize + audit
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer normalize --dry-run
      - run: composer audit
  lowest-deps:
    name: quality / prefer-lowest install + test
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.1' }
      - run: composer update --no-interaction --prefer-lowest
      - run: vendor/bin/phpunit
  layering:
    # Self-enables when deptrac.yaml lands. hashFiles() is runner-only — it is NOT available
    # in a job-level `if` (startup failure on the whole workflow), so the config-presence
    # guard lives in a step.
    name: quality / deptrac layer rules
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for deptrac.yaml (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f deptrac.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3' }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - if: steps.cfg.outputs.present == 'true'
        run: vendor/bin/deptrac analyse
  mutation:
    # Same step-level guard as `layering`: hashFiles() cannot gate a job-level `if`.
    name: quality / infection mutation score
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for infection.json5 (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f infection.json5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3', coverage: pcov }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - if: steps.cfg.outputs.present == 'true'
        run: vendor/bin/infection --min-msi=70 --only-covered

  # ---------------------------------------------------------------------------
  # Coverage floor (roadmap 2.7, ADR-0007). AGENTS.md §10 and spec NFR-07 both require >= 90%
  # line coverage; PHPUnit 10 ships a dozen --fail-on-* switches and no coverage threshold among
  # them, so the comparison lives in tools/coverage_gate.py.
  #
  # Measured ONCE, on one interpreter, rather than per matrix cell: line coverage of this library
  # does not vary by PHP version, so three runs would be three identical numbers at three times
  # the cost. The build matrix proves the tests pass everywhere; this proves how much they reach.
  #
  # --coverage-text is deliberate alongside the machine-read report: it puts the number in the
  # log unconditionally, so a failure shows what the coverage actually was and not merely that a
  # threshold was missed.
  # ---------------------------------------------------------------------------
  coverage:
    name: quality / coverage floor
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - name: Measure coverage
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-text
      - name: Enforce the coverage floor (ADR-0007)
        run: python tools/coverage_gate.py build/logs/clover.xml --min 90

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  #
  # Self-enables when the phpbench harness lands (roadmap 3.5 / 7.1), via the same step-level
  # config guard as `layering` and `mutation`: hashFiles() is runner-only and cannot gate a
  # job-level `if` without failing the whole workflow at startup.
  #
  # The PHP setup below is written FOR THIS JOB rather than inherited from the build matrix.
  # The generated version injected the matrix's setup steps verbatim into a job that declares
  # no matrix, leaving two defects (roadmap 1.9):
  #   - `php-version: ${{ matrix.toolchain == 'php-8.1' && ... || '8.3' }}` — `matrix` is null
  #     here, so the ternary always fell through to '8.3'. Verified on run 30811447268: the job
  #     installed PHP 8.3.33. That happens to match the methodology below, which is worse than
  #     a visible error — it was right by accident, and would have silently selected the wrong
  #     interpreter the moment anyone gave this job a matrix.
  #   - `coverage: pcov` — coverage instrumentation distorts the very measurements this job
  #     exists to take.
  # Spec NFR-06 pins the benchmark interpreter to PHP 8.3; the rest of that methodology
  # (10 iterations x 100 revs, 5% retry threshold, OPcache + JIT off, >10% regression fails)
  # lands with the harness in roadmap item 7.1.
  # ---------------------------------------------------------------------------
  # Benchmarks (spec NFR-06). Two gates, because they catch different failures.
  #
  # `regression` compares HEAD against the base commit ON THE SAME RUNNER, which is what makes
  # NFR-06's 10% threshold usable. Measured before it was chosen: across nine master runs where
  # QueryBuilder and its benchmark were provably unchanged, one subject ranged 2.684-3.767us --
  # 40.4% peak to peak on GitHub's shared runners -- while five consecutive passes inside ONE job
  # spread 0.4-1.5%. A stored baseline at 10% would have fired on noise; a same-runner A/B gives
  # the threshold roughly six times the noise it must clear.
  #
  # `budgets` checks the absolute NFR ceilings, which the relative gate structurally cannot:
  # twenty commits at +9% each pass every regression check and still double the runtime.
  # ---------------------------------------------------------------------------
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline half needs a second commit to check out, so the default shallow
          # single-commit fetch is not enough.
          fetch-depth: 0
      - name: Check for a phpbench config (job self-enables when the harness lands)
        id: cfg
        shell: bash
        run: |
          if [ -f phpbench.json ] || [ -f phpbench.json.dist ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmarks pending::No phpbench config yet, so the benchmark suite is skipped."
          fi
      - name: Set up PHP
        if: steps.cfg.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'   # spec NFR-06 benchmark methodology — not the build matrix
          coverage: none       # instrumentation would distort the measurements
          # NFR-06 requires OPcache and JIT off. Asserted below rather than trusted.
          ini-values: opcache.enable_cli=0, opcache.jit=disable, opcache.jit_buffer_size=0
      - name: Assert the measurement environment matches NFR-06
        if: steps.cfg.outputs.present == 'true'
        run: php tools/assert_bench_env.php
      - name: Install dependencies
        if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Measure HEAD
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          vendor/bin/phpbench run --report=aggregate --dump-file=build/logs/head.xml
      - name: Absolute NFR budgets
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_budget_gate.py build/logs/head.xml             --budget benchHydrateWarm=5             --budget benchBuildFiveConditionSelect=10             --budget benchWarmSingletonResolve=2             --budget benchFirstAutowiredResolve=30
      - name: NFR-01 ratio — hydration vs manual construction
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_ratio_gate.py build/logs/head.xml             --numerator benchHydrateWarm --denominator benchManualConstruction --max-ratio 3
      - name: Resolve the base commit to compare against
        if: steps.cfg.outputs.present == 'true'
        id: base
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::notice title=No baseline::No reachable base commit, so the regression gate has nothing to compare against. The absolute budgets above still ran."
          else
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure the base commit on this same runner
        if: steps.cfg.outputs.present == 'true' && steps.base.outputs.sha != ''
        shell: bash
        run: |
          git worktree add ../baseline "${{ steps.base.outputs.sha }}"
          cd ../baseline
          composer install --no-interaction --prefer-dist --quiet
          # Written back into the HEAD workspace so both reports sit side by side.
          vendor/bin/phpbench run --progress=none --dump-file="$GITHUB_WORKSPACE/build/logs/base.xml"
      - name: Regression gate — NFR-06's 10% budget
        if: steps.cfg.outputs.present == 'true' && steps.base.outputs.sha != ''
        shell: bash
        run: python3 tools/bench_regression_gate.py build/logs/base.xml build/logs/head.xml --max-regression 10
      - name: Keep the reports
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: benchmark-reports
          path: build/logs/*.xml
          if-no-files-found: warn
