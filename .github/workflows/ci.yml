name: ci

# Enterprise CI gate for egl-util-php, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on master (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for. The moment `composer.json` exists
  # every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the build system in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "composer.json" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::composer.json is not present yet, so the toolchain jobs are skipped. They start running by themselves once roadmap item 1.1 lands the build system."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: php-8.1, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.2, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.3, preset: default }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.toolchain == 'php-8.1' && '8.1' || matrix.toolchain == 'php-8.2' && '8.2' || '8.3' }}
          # No coverage driver here on purpose. This job never passed a --coverage flag, so pcov
          # was loaded and never used — overhead that also made the matrix *look* like it was
          # measuring a floor nothing compared (roadmap 2.7). Coverage is measured once, in the
          # `coverage` job below.
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build
        shell: bash
        run: composer install --optimize-autoloader

      - name: Test
        shell: bash
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Real-engine database leg (issue #110, ADR-0071).
  #
  # Everything the `Database` and `Persistence` groups claim about a real database was proved
  # against SQLite and nothing else. The PDO-boundary binding proof is engine-independent, but the
  # dialect behaviour around it is not: identifier quoting is a per-driver `match` with one arm
  # ever executed, LIKE's default escape differs, savepoint syntax is three statements nobody had
  # sent to MySQL, and driver type coercion decides whether strict DTO hydration works at all.
  # SQLite is also the engine already caught being too lenient once — the double-quoted-string
  # misfeature ADR-0044 rests on.
  #
  # So the `database-engine` group re-runs here against MySQL and PostgreSQL. It is a separate job
  # rather than three more cells in the `build` matrix because a service container is a per-job
  # thing and the ordinary matrix must stay fast and dependency-free.
  #
  # `--fail-on-skipped` is the mechanical form of the issue's third criterion. A leg that reports
  # success without reaching a database is worse than no leg: it certifies coverage nobody has.
  # Three independent things now make that impossible — the service health check gates the job,
  # the preflight step below refuses an unreachable server with our own message, and PHPUnit fails
  # if a single test in the group skips for any reason at all.
  # ---------------------------------------------------------------------------
  database:
    name: database / ${{ matrix.label }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mysql 8.4
            image: mysql:8.4
            port: 3306
            user: root
            password: egl-test
            health: mysqladmin ping -h 127.0.0.1 --silent
            dsn: mysql:host=127.0.0.1;port=3306;dbname=egl_utils_test;charset=utf8mb4
          - label: postgres 16
            image: postgres:16
            port: 5432
            user: postgres
            password: egl-test
            health: pg_isready -U postgres -d egl_utils_test
            dsn: pgsql:host=127.0.0.1;port=5432;dbname=egl_utils_test
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # Both images read only their own variables and ignore the rest, which is what lets one
          # service definition serve both matrix legs. Splitting this into two jobs to avoid the
          # unused half would duplicate every step below.
          MYSQL_ROOT_PASSWORD: ${{ matrix.password }}
          MYSQL_DATABASE: egl_utils_test
          POSTGRES_USER: ${{ matrix.user }}
          POSTGRES_PASSWORD: ${{ matrix.password }}
          POSTGRES_DB: egl_utils_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    env:
      EGL_TEST_DB_DSN: ${{ matrix.dsn }}
      EGL_TEST_DB_USER: ${{ matrix.user }}
      EGL_TEST_DB_PASSWORD: ${{ matrix.password }}
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The floor, not the ceiling. Driver type coercion is the one behaviour in this leg that
          # changed across the 8.x line, so the version that reveals a difference is the oldest one
          # this library supports rather than the newest one CI happens to have.
          php-version: '8.1'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: The engine must be reachable, and say so in our words
        shell: bash
        run: |
          # The service health check already gates the job, so reaching this step means the
          # container is up. What it does not prove is that PHP can authenticate against it with
          # the credentials this job will hand the suite — a different failure with a much less
          # obvious symptom, since PHPUnit would report it once per test.
          php -r '
            $dsn = getenv("EGL_TEST_DB_DSN");
            try {
                $pdo = new PDO($dsn, getenv("EGL_TEST_DB_USER"), getenv("EGL_TEST_DB_PASSWORD"));
                printf("connected: %s %s%s", $pdo->getAttribute(PDO::ATTR_DRIVER_NAME),
                    $pdo->getAttribute(PDO::ATTR_SERVER_VERSION), PHP_EOL);
            } catch (PDOException $e) {
                fwrite(STDERR, "::error title=Engine unreachable::" . $dsn . " -- " . $e->getMessage() . PHP_EOL);
                exit(1);
            }'

      - name: The behavioural suites, against ${{ matrix.label }}
        run: vendor/bin/phpunit --group database-engine --fail-on-skipped

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The action-pin step resolves each version comment against its upstream repository, so it
    # needs the API. GITHUB_TOKEN is read-only here (`permissions: contents: read` above) and
    # only lifts the unauthenticated rate limit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py
      # The per-diff coverage gate's own proof that it can fail (issue #109, ADR-0068). It lives
      # here rather than in the `coverage` job because it needs neither PHP nor a coverage driver —
      # only git and Python, both of which this job already has, and full history, which it already
      # fetches. Every prior tools/*.py on this project was verified by hand in a scratch directory
      # and the outcome written into an ADR; this one ships the proof so it re-runs on every PR.
      - name: Verify the per-diff coverage gate can fail
        run: python tools/tests/verify_diff_coverage_gate.py
      # And the links check's own proof (issue #116, ADR-0069). Its strongest evidence is not
      # synthetic -- it found nineteen broken links on master the first time it ran, against the
      # five the review board had counted -- but that demonstration was single-use, so the
      # repeatable half lives in a script beside the one above.
      - name: Verify the documentation link check can fail
        run: python tools/tests/verify_link_check.py
      # And the Release-body renderer's (issue #106, ROADMAP 13.5). It runs here, on every PR,
      # rather than only in release.yml: the notes it renders are edited between releases, and a
      # dangling link introduced today should surface now instead of at the tag push, when the
      # tool's refusal would read as a broken release rather than as prose that needs fixing.
      - name: Verify the Release-body renderer can fail
        run: python tools/tests/verify_release_body.py
      # And the BC gate's discount (ADR-0031, amended). It runs here rather than only in the
      # backward-compatibility job because that job is release-PR-only: the discount's narrowness
      # is exactly what must not rot between releases, and this is where it gets checked.
      - name: Verify the BC gate's version-constant discount is narrow
        run: python tools/tests/verify_bc_gate.py
      # The dist's CONTENTS, not .gitattributes' rules (issue #119). A rule list cannot tell you
      # about a file nobody wrote a rule for, which is exactly how phpdoc.dist.xml shipped in
      # v1.1.0's archive. Runs on every PR, because the PR that adds a top-level file is the only
      # moment anyone would think about it.
      - name: Assert the dist contains only what a consumer needs
        run: python tools/dist_gate.py
      - name: Verify the dist gate can fail
        run: python tools/tests/verify_dist_gate.py
      # The pre-push tag guard (issue #115, ADR-0032). It is a LOCAL hook, so CI can never exercise
      # it in anger -- which is exactly why its proof runs here: the guard nobody can test is the
      # guard nobody notices rotting.
      - name: Verify the pre-push tag guard can fail
        run: python tools/tests/verify_tag_guard.py
      # ADR-0003's gate. Runs WITH --verify-upstream: the offline half only checks the pin
      # shape, and a version comment that lies is invisible to any purely local check when the
      # error is applied uniformly. CI is where the truthful half must run.
      - name: Enforce the CI action-pinning policy (ADR-0003)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/action_pin_lint.py --verify-upstream

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / cs-fixer + phpstan
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse
  hygiene:
    name: quality / composer normalize + audit + require-checker
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer normalize --dry-run
      - run: composer audit

      # ComposerRequireChecker >=4.16 needs PHP >=8.2 — above this library's 8.1 floor (the
      # `lowest-deps` job installs dev deps too), so it is installed outside the package's own
      # dependency graph, the same throwaway-install pattern `nightly.yml` uses for Psalm and
      # Infection (ADR-0031/ADR-0040). Issue #98's ask (#98): prove `require` matches the symbols
      # actually reached — e.g. that `ext-fileinfo` is genuinely used, not a stale declaration.
      - name: Install ComposerRequireChecker outside this package's dependency graph
        run: |
          mkdir -p "$RUNNER_TEMP/require-checker-tool"
          composer require --working-dir="$RUNNER_TEMP/require-checker-tool" \
            --no-interaction "maglnet/composer-require-checker:^4.16"

      - name: Every used symbol is a declared requirement
        run: |
          "$RUNNER_TEMP/require-checker-tool/vendor/bin/composer-require-checker" check \
            --config-file=composer-require-checker.json composer.json
  lowest-deps:
    name: quality / prefer-lowest install + test
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.1' }
      - run: composer update --no-interaction --prefer-lowest
      - run: vendor/bin/phpunit
  layering:
    # Self-enables when deptrac.yaml lands. hashFiles() is runner-only — it is NOT available
    # in a job-level `if` (startup failure on the whole workflow), so the config-presence
    # guard lives in a step.
    name: quality / deptrac layer rules
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for deptrac.yaml (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f deptrac.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3' }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - if: steps.cfg.outputs.present == 'true'
        run: vendor/bin/deptrac analyse
  # ---------------------------------------------------------------------------
  # Mutation score (roadmap 10.8, ADR-0040). Spec NFR-07 requires >= 70% MSI on the
  # Security/Database/Dto namespaces, and until item 10.8 nothing measured it: `infection.json5`
  # did not exist, so the config guard below reported `present=false` and this job passed in
  # seconds having run nothing — item 2.7's coverage-gate shape, a second time.
  #
  # Two further defects in the original step surfaced only by running it:
  #   - `vendor/bin/infection` never existed. Infection is NOT and cannot be a dependency of
  #     this package: every release from 0.29.10 on requires PHP ^8.2/^8.3 against this
  #     library's 8.1 floor, and the older 8.1-compatible releases conflict with versions this
  #     project already locks (justinrainbow/json-schema, fidry/cpu-core-counter,
  #     composer/xdebug-handler). Installed into a throwaway project instead, exactly as
  #     ADR-0031 does for the BC checker, so the 8.1 matrix cell and `--prefer-lowest` stay
  #     untouched.
  #   - `--only-covered` is not an Infection option (verified against 0.34.1's own `run`
  #     usage line). Uncovered code is excluded by default now; the inverse flag is
  #     `--with-uncovered`. The original line would have failed on argument parsing.
  #
  # The interpreter is 8.3 with pcov, matching the coverage job: mutation testing measures
  # test-suite strength, not runtime compatibility, so it does not need the 8.1 floor.
  # ---------------------------------------------------------------------------
  mutation:
    # Same step-level guard as `layering`: hashFiles() cannot gate a job-level `if`.
    name: quality / infection mutation score
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for infection.json5 (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f infection.json5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3', coverage: pcov }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Install Infection outside this package's dependency graph
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-tool"
          # Constrained rather than floating, for ADR-0031's reason: a tool that changes its
          # own findings between runs makes a quality gate unreviewable. `--no-plugins`
          # because infection/extension-installer would otherwise need an allow-plugins
          # prompt, and no Infection extensions are installed for it to register.
          composer require --working-dir="$RUNNER_TEMP/mutation-tool" \
            --no-interaction --no-plugins "infection/infection:^0.34"
      - name: Mutation score against NFR-07's 70% floor
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          php "$RUNNER_TEMP/mutation-tool/vendor/bin/infection" \
            --min-msi=70 --no-progress --no-interaction -j2
      - name: Keep the mutation report
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mutation-report
          path: build/logs/infection*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Coverage floor (roadmap 2.7, ADR-0007). AGENTS.md §10 and spec NFR-07 both require >= 90%
  # line coverage; PHPUnit 10 ships a dozen --fail-on-* switches and no coverage threshold among
  # them, so the comparison lives in tools/coverage_gate.py.
  #
  # Measured ONCE, on one interpreter, rather than per matrix cell: line coverage of this library
  # does not vary by PHP version, so three runs would be three identical numbers at three times
  # the cost. The build matrix proves the tests pass everywhere; this proves how much they reach.
  #
  # --coverage-text is deliberate alongside the machine-read report: it puts the number in the
  # log unconditionally, so a failure shows what the coverage actually was and not merely that a
  # threshold was missed.
  # ---------------------------------------------------------------------------
  coverage:
    name: quality / coverage floor
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The per-diff gate below needs the base commit to diff against, and checkout fetches a
          # single commit by default. Without this the gate exits 2 ("cannot run") rather than
          # treating an unresolvable base as an empty diff — but failing loudly on every PR is not
          # the arrangement we want, so the history is here.
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - name: Measure coverage
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-text
      - name: Enforce the coverage floor (ADR-0007)
        run: python tools/coverage_gate.py build/logs/clover.xml --min 90
      # The other half of that floor (issue #109, ADR-0068). The step above measures TOTAL
      # coverage, and says on every run what it cannot see: with the suite well above 90%, an
      # untested addition rides inside the headroom. This intersects the report with the lines
      # this change actually touched.
      #
      # pull_request only, and deliberately. On a push to master the change is already merged, so
      # a per-diff figure there would report on history rather than gate anything — and the total
      # floor above still runs on both events.
      - name: Enforce per-diff coverage (issue #109)
        if: github.event_name == 'pull_request'
        run: |
          python tools/diff_coverage_gate.py build/logs/clover.xml \
            --base '${{ github.event.pull_request.base.sha }}' --min 90
      # The temporary measurement step that stood here is gone: it did its job on run
      # 32464266232 and the 90% floor above is now confirmed on evidence rather than on the
      # argument that it is NFR-07's own number. The three readings, recorded in ADR-0068:
      # Hmac 62/62 (100%), RetryPolicy 89/89 (100%), the rate limiter 167/175 (95.43%).

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  #
  # Self-enables when the phpbench harness lands (roadmap 3.5 / 7.1), via the same step-level
  # config guard as `layering` and `mutation`: hashFiles() is runner-only and cannot gate a
  # job-level `if` without failing the whole workflow at startup.
  #
  # The PHP setup below is written FOR THIS JOB rather than inherited from the build matrix.
  # The generated version injected the matrix's setup steps verbatim into a job that declares
  # no matrix, leaving two defects (roadmap 1.9):
  #   - `php-version: ${{ matrix.toolchain == 'php-8.1' && ... || '8.3' }}` — `matrix` is null
  #     here, so the ternary always fell through to '8.3'. Verified on run 30811447268: the job
  #     installed PHP 8.3.33. That happens to match the methodology below, which is worse than
  #     a visible error — it was right by accident, and would have silently selected the wrong
  #     interpreter the moment anyone gave this job a matrix.
  #   - `coverage: pcov` — coverage instrumentation distorts the very measurements this job
  #     exists to take.
  # Spec NFR-06 pins the benchmark interpreter to PHP 8.3; the rest of that methodology
  # (10 iterations x 100 revs, 5% retry threshold, OPcache + JIT off, >10% regression fails)
  # lands with the harness in roadmap item 7.1.
  # ---------------------------------------------------------------------------
  # Benchmarks (spec NFR-06). Two gates, because they catch different failures.
  #
  # `regression` compares HEAD against the base commit ON THE SAME RUNNER, which is what makes
  # NFR-06's 10% threshold usable. Measured before it was chosen: across nine master runs where
  # QueryBuilder and its benchmark were provably unchanged, one subject ranged 2.684-3.767us --
  # 40.4% peak to peak on GitHub's shared runners -- while five consecutive passes inside ONE job
  # spread 0.4-1.5%. A stored baseline at 10% would have fired on noise; a same-runner A/B gives
  # the threshold roughly six times the noise it must clear.
  #
  # `budgets` checks the absolute NFR ceilings, which the relative gate structurally cannot:
  # twenty commits at +9% each pass every regression check and still double the runtime.
  # ---------------------------------------------------------------------------
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline half needs a second commit to check out, so the default shallow
          # single-commit fetch is not enough.
          fetch-depth: 0
      - name: Check for a phpbench config (job self-enables when the harness lands)
        id: cfg
        shell: bash
        run: |
          if [ -f phpbench.json ] || [ -f phpbench.json.dist ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmarks pending::No phpbench config yet, so the benchmark suite is skipped."
          fi
      - name: Set up PHP
        if: steps.cfg.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'   # spec NFR-06 benchmark methodology — not the build matrix
          coverage: none       # instrumentation would distort the measurements
          # NFR-06 requires OPcache and JIT off. Asserted below rather than trusted.
          ini-values: opcache.enable_cli=0, opcache.jit=disable, opcache.jit_buffer_size=0
      - name: Assert the measurement environment matches NFR-06
        if: steps.cfg.outputs.present == 'true'
        run: php tools/assert_bench_env.php
      - name: Install dependencies
        if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Measure HEAD
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          vendor/bin/phpbench run --report=aggregate --dump-file=build/logs/head.xml
      - name: Absolute NFR budgets
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_budget_gate.py build/logs/head.xml             --budget benchHydrateWarm=5             --budget benchBuildFiveConditionSelect=10             --budget benchWarmSingletonResolve=2             --budget benchFirstAutowiredResolve=30             --budget benchSequenceNext=450             --budget benchWriteTenThousandByTen=150000             --budget benchDispatchLastOfFiftyRoutes=15             --budget benchEnvelopeBuild=2             --budget benchSuppressedRecord=0.5             --budget benchCryptoRoundTrip=60             --budget benchUlid=10             --budget benchUuidV7=10
      - name: NFR-01 ratio — hydration vs manual construction
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_ratio_gate.py build/logs/head.xml             --numerator benchHydrateWarm --denominator benchManualConstruction --max-ratio 3
      - name: NFR-09 ratio — gateway fetch+normalize+hydrate vs hand-written PDO
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_ratio_gate.py build/logs/head.xml             --numerator benchGatewayFetchNormalizeHydrate --denominator benchHandWrittenPdoLoop --max-ratio 2.5
      - name: Resolve the base commit to compare against
        if: steps.cfg.outputs.present == 'true'
        id: base
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::notice title=No baseline::No reachable base commit, so the regression gate has nothing to compare against. The absolute budgets above still ran."
          else
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure the base commit, then gate — retrying once on a control-subject breach (ADR-0057, issue #99)
        if: steps.cfg.outputs.present == 'true' && steps.base.outputs.sha != ''
        shell: bash
        run: |
          set -e
          git worktree add ../baseline "${{ steps.base.outputs.sha }}"
          (cd ../baseline && composer install --no-interaction --prefer-dist --quiet)
          # Written back into the HEAD workspace so both reports sit side by side.
          (cd ../baseline && vendor/bin/phpbench run --progress=none --dump-file="$GITHUB_WORKSPACE/build/logs/base.xml")

          # One function so both attempts run the IDENTICAL command. Item 12.4, the incident
          # ADR-0057 was written from, was the same commit failing two different gates on two
          # different runs -- the gate call itself is the one thing that must not vary between
          # attempts, or a difference in the command would confound a difference in the runner.
          gate() {
            python3 tools/bench_regression_gate.py build/logs/base.xml build/logs/head.xml \
              --max-regression 10 \
              --exclude "FileSequenceBench::benchSequenceNext" \
              --exclude "HashBench::benchMakeArgon2id" \
              --exclude "HashBench::benchVerifyArgon2id" \
              --control "RowNormalizerBench::benchInlineTrimHundredRows" \
              --control "LoggingBench::benchSinkDirectly"
          }

          set +e
          gate
          CODE=$?
          set -e

          # Exit 2 -- ADR-0057's "INVALID": a control subject moved past the threshold, so
          # nothing else this run measured can be trusted either. This is the ONE code this step
          # retries, and it retries it exactly once (issue #99's own acceptance criterion).
          if [ "$CODE" -eq 2 ]; then
            echo "::warning title=Control breach — retrying once (ADR-0057, issue #99)::A control subject (a benchmark calling no code this project owns) moved past the regression threshold, so this run's A/B is not trustworthy. Re-measuring HEAD and the base commit once, together, before treating anything else this run reported as real."

            # Re-measured TOGETHER, in this order, on the retry too -- not just the base commit.
            # ADR-0030's noise argument depends on base and HEAD being measured SEQUENTIALLY on
            # one runner; gating a freshly re-measured base against the FIRST attempt's (now
            # stale) head.xml would not be that comparison, only a different, equally invalid one.
            vendor/bin/phpbench run --report=aggregate --dump-file=build/logs/head.xml
            (cd ../baseline && vendor/bin/phpbench run --progress=none --dump-file="$GITHUB_WORKSPACE/build/logs/base.xml")

            set +e
            gate
            CODE=$?
            set -e

            if [ "$CODE" -eq 2 ]; then
              echo "::error title=Control breached twice in a row::ADR-0057's retry budget is exactly one attempt (issue #99). Two consecutive invalidated runs on the same control subject(s) is unlikely to be one-off runner noise -- investigate the runner or the control subjects themselves rather than re-running again."
              exit 1
            fi
          fi

          # Exit 1 -- a real regression (or a config error the gate itself already explained in
          # its own FAIL message above) -- is NEVER retried, on either attempt: ADR-0057's whole
          # point is that this code means something different from exit 2, and retrying it would
          # erase the distinction the gate exists to draw.
          case "$CODE" in
            0) exit 0 ;;
            1) exit 1 ;;
            *)
              echo "::error title=Unexpected exit code from bench_regression_gate.py::Got $CODE, which is neither 0 (pass), 1 (real failure) nor 2 (invalid run) — bench_regression_gate.py's own contract, so this is a bug in the gate or in this step, not a benchmark result."
              exit 1
              ;;
          esac
      - name: Keep the reports
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: benchmark-reports
          path: build/logs/*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Backward compatibility — one job, two runs, two different questions (spec NFR-07, ADR-0031,
  # amended for issue #112).
  #
  # **The gate** runs only on a **release PR** and asks *"are these breaks allowed in this bump?"*
  # That is where the imported spec §8 places it and where it is actionable, since the remedy is
  # the bump. A release PR is detected mechanically — the PR changes `Version.php`'s VERSION
  # constant, which is step 1 of docs/workflow/release.md — rather than by a label, because a
  # label the maintainer forgets is a gate that silently does not run. **Nothing about it changed
  # here.**
  #
  # **The report** runs on every PR and asks *"is the frozen public surface still intact?"*
  # ADR-0059 froze the API at 1.0.0, so every 1.x release is additive by promise; the baseline is
  # therefore the **oldest tag of the current MAJOR line**, not the newest tag. ADR-0031 rejected
  # a per-PR run on pre-1.0 grounds — breaks were legal on most PRs then, and a check that is
  # routinely and correctly ignored stops being read. The freeze inverted that: now every reported
  # break is signal, and finding one only when the next release PR is cut puts the discovery far
  # from the change that caused it.
  #
  # The baseline is **computed, not written down** (`v${MAJOR}.*.*`, oldest first). Issue #112 says
  # "the v1.0.0 tag"; hard-coding that string would be correct today and wrong the day a `v2.0.0`
  # exists — the failure #161 named, a claim that has to be edited every release being wrong
  # between them.
  #
  # The report never fails the build for a finding. It **does** fail if it could not read one:
  # `bc_gate.py --report-only` exits 1 on an unreadable or unparseable report, and the step exits 1
  # if no `findings=` line comes back. A permanently green report-only tick over an unanswered
  # question is the exact shape of vacuous green this repository has been bitten by repeatedly.
  #
  # Two things this job must not do:
  #
  # 1. **Fail before the first tag exists.** `roave/backward-compatibility-check` exits 1 with
  #    "Could not detect any released versions for the given repository" when a repo has no tags —
  #    verified. This one has none yet, and the first release PR is exactly when the check would
  #    first run. So it SKIPS on a declared condition and self-enables at the first `v*.*.*` tag
  #    (lesson L-0010).
  # 2. **Enter this package's dependency graph.** Every version from 8.7.0 requires PHP >= 8.2,
  #    later >= 8.3 and >= 8.4, while this library's floor is 8.1 — which is why
  #    `config.platform.php` is pinned to 8.1.34. Adding it as a dev dependency would either break
  #    the 8.1 matrix cell or abandon 8.1 support. It is installed into a throwaway project
  #    instead, so the tool can be modern while the library stays on its floor.
  # ---------------------------------------------------------------------------
  backward-compatibility:
    name: quality / backward compatibility
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and the base commit are both needed; the default shallow fetch has neither.
          fetch-depth: 0

      - name: Is this a release PR, and what are the two baselines?
        id: scope
        shell: bash
        run: |
          CURRENT="$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/main/php/d4np/utils/Version.php)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          PREVIOUS="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

          # The frozen baseline: the OLDEST tag of the MAJOR line currently in Version.php, which
          # is the release the freeze (ADR-0059) is measured from. Computed rather than written as
          # `v1.0.0` so it follows the project into a v2 without an edit — and so that a MAJOR
          # release PR, where no tag of the new line exists yet, resolves to empty and says so
          # instead of silently comparing against the wrong line.
          MAJOR="${CURRENT%%.*}"
          FROZEN="$(git tag -l "v${MAJOR}.*.*" --sort=v:refname | head -n1)"
          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"

          if [ -n "$FROZEN" ]; then
            echo "::notice title=BC report will run::Report-only comparison against $FROZEN, the frozen ${MAJOR}.x surface."
          else
            echo "::notice title=No frozen baseline yet::Version.php reads $CURRENT and no v${MAJOR}.*.* tag exists, so there is no frozen surface of this MAJOR line to report against. The release gate below is unaffected."
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          RELEASE_PR=false
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- src/main/php/d4np/utils/Version.php; then
            RELEASE_PR=true
          fi
          echo "release_pr=$RELEASE_PR" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_PR" != "true" ]; then
            echo "::notice title=Not a release PR::Version.php is unchanged, so the BC check does not apply. Spec NFR-07 places it on release PRs."
          elif [ -z "$PREVIOUS" ]; then
            echo "::notice title=No released version yet::This repository has no v*.*.* tag, and roave/backward-compatibility-check needs one to compare against. The gate self-enables at the first tag."
          else
            echo "::notice title=BC check will run::Comparing $PREVIOUS against $CURRENT."
          fi

      - name: Set up PHP
        # Both runs need this, so it is gated on there being ANY tag rather than on the mode.
        if: steps.scope.outputs.previous != ''
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The tool's own floor, not this library's. See the header comment.
          php-version: '8.3'
          coverage: none

      - name: Install the BC checker outside this package's dependency graph
        # Both runs need this, so it is gated on there being ANY tag rather than on the mode.
        if: steps.scope.outputs.previous != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bc-tool"
          # Constrained rather than floating: an unpinned tool that changes its own findings between
          # runs makes a release gate unreviewable.
          composer require --working-dir="$RUNNER_TEMP/bc-tool" --no-interaction \
            "roave/backward-compatibility-check:^8.16"

      - name: Install this package's own dependencies
        # Both runs need this, so it is gated on there being ANY tag rather than on the mode.
        if: steps.scope.outputs.previous != ''
        run: composer install --no-interaction --prefer-dist

      # ---- the report, on every PR (issue #112) ------------------------------------------------
      #
      # Runs before the gate so that on a release PR — the one event where both run — the frozen
      # surface is reported even if the gate then fails the job.
      - name: Report-only — is anything broken since ${{ steps.scope.outputs.frozen }}?
        if: steps.scope.outputs.frozen != ''
        shell: bash
        run: |
          set +e
          php "$RUNNER_TEMP/bc-tool/vendor/bin/roave-backward-compatibility-check" \
            --from="${{ steps.scope.outputs.frozen }}" --format=markdown | tee bc-report-frozen.md
          CODE=${PIPESTATUS[0]}
          set -e
          echo "The checker exited $CODE (0 means no backward-incompatible change)."

          # pipefail, so that bc_gate.py exiting 1 — which it does when it cannot READ a report —
          # fails this step instead of being masked by tee's own 0. `--report` is passed
          # unconditionally: report-only ignores it when the checker found nothing.
          set -o pipefail
          python3 tools/bc_gate.py --report-only \
            --previous "${{ steps.scope.outputs.frozen }}" \
            --bc-exit "$CODE" \
            --report bc-report-frozen.md | tee bc-report-only.txt
          set +o pipefail

          {
            echo "### Backward compatibility vs \`${{ steps.scope.outputs.frozen }}\` — report only"
            echo
            echo '```'
            cat bc-report-only.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          N="$(sed -n 's/^findings=//p' bc-report-only.txt)"
          if [ -z "$N" ]; then
            echo "::error title=BC report unreadable::bc_gate.py --report-only printed no findings= line, so this step cannot say whether the frozen surface is intact. Failing rather than passing."
            exit 1
          fi
          if [ "$N" != "0" ]; then
            echo "::warning title=$N break(s) since ${{ steps.scope.outputs.frozen }}::The public surface is frozen at that tag (ADR-0059), so a 1.x change must be additive. This is a REPORT, not a gate — see the job summary for the findings."
          fi

      - name: Keep the report-only comparison
        if: always() && steps.scope.outputs.frozen != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backward-compatibility-report-frozen
          path: |
            bc-report-frozen.md
            bc-report-only.txt
          if-no-files-found: warn

      # ---- the gate, on release PRs only — unchanged by #112 -----------------------------------
      - name: Detect backward-incompatible changes since ${{ steps.scope.outputs.previous }}
        id: bc
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        shell: bash
        run: |
          set +e
          php "$RUNNER_TEMP/bc-tool/vendor/bin/roave-backward-compatibility-check" \
            --from="${{ steps.scope.outputs.previous }}" --format=markdown | tee bc-report.md
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "The checker exited $CODE (0 means no backward-incompatible change)."

      - name: Gate the findings against the version bump
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        shell: bash
        run: |
          # --report is what lets the gate tell the version bump apart from a real break.
          # Roave reports Version::VERSION changing value as a BC break, and a release PR
          # changes exactly that constant, so without this the gate fails EVERY release by
          # construction. Nothing else is discounted (ADR-0031, amended).
          python3 tools/bc_gate.py \
            --previous "${{ steps.scope.outputs.previous }}" \
            --current "${{ steps.scope.outputs.current }}" \
            --bc-exit "${{ steps.bc.outputs.code }}" \
            --report bc-report.md

      - name: Keep the BC report
        if: always() && steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backward-compatibility-report
          path: bc-report.md
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The PSR-7 bridge's contract suite, in **PR mode** (ADR-0033, spec 02 §7).
  #
  # This is the property the monorepo topology was chosen for: the bridge is tested against the
  # core **in the working tree**, so a core change that breaks the conversion contract fails in the
  # pull request that introduces it — not later, in another repository's CI, after it merged.
  #
  # The path repository is injected into the CI **workspace only**. Committing it would point the
  # published package at `../../`, which exists nowhere outside this monorepo, and every standalone
  # install would fail while nothing here noticed. `BridgePackageBoundaryTest` in the core suite
  # asserts the committed manifest stays clean — verified: planting the injection fails 2 of its
  # tests.
  #
  # Self-enabling on the package's composer.json (lesson L-0010): item 8.1 ships the scaffold with
  # no converters and no contract suite, so until 8.2 lands there is nothing to run. The job says
  # so in a notice rather than passing silently, because a skip and a pass look identical on a
  # green tick.
  # ---------------------------------------------------------------------------
  bridge-contract:
    name: quality / ${{ matrix.package }} contract (${{ matrix.psr7 }})
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both PSR-17 implementations spec 02/03 §7 require: one alone would let the contract
        # silently encode that vendor's leniencies.
        psr7: [nyholm, guzzle]
        # Every bridge package, since issue #93 added the second. A new package is one entry
        # here and inherits the whole job rather than getting a copy of it.
        package: [utils-psr7-bridge, utils-psr18-bridge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does the bridge package have anything to run yet?
        id: pkg
        shell: bash
        run: |
          if [ ! -f packages/${{ matrix.package }}/composer.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bridge package absent::packages/${{ matrix.package }}/composer.json does not exist, so there is nothing to test. This job enables itself when the package lands."
            exit 0
          fi
          if [ -z "$(find packages/${{ matrix.package }}/src/test -name '*Test.php' -print -quit 2>/dev/null)" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bridge contract suite pending::The package scaffold exists but carries no tests yet. Its contract suite runs from the moment one lands."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.pkg.outputs.ready == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The package's own floor. The bridge must not narrow the core's, and the core supports 8.1.
          php-version: '8.1'
          coverage: none

      - name: Resolve the core from the working tree (workspace only — never committed)
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/${{ matrix.package }}
        run: |
          composer config repositories.monorepo path ../../
          composer require "egl/utils:@dev" --no-update --no-interaction
          composer update --no-interaction --prefer-dist

      - name: Prove the core really came from this checkout
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          # Without this, a resolution that quietly fell back to a published egl/utils would make
          # the whole same-PR guarantee a fiction while every test still passed.
          TYPE="$(php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach($l["packages"] as $p){ if($p["name"]==="egl/utils"){ echo $p["dist"]["type"] ?? ($p["source"]["type"] ?? "?"); } }')"
          echo "egl/utils resolved as: $TYPE"
          if [ "$TYPE" != "path" ]; then
            echo "::error title=Core not from the working tree::egl/utils resolved as '$TYPE', not 'path'. The bridge would be tested against a published core instead of the code in this PR, which is the entire property ADR-0033 chose the monorepo for."
            exit 1
          fi

      - name: Pin the PSR-17 implementation under test
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/${{ matrix.package }}
        run: |
          composer remove --dev --no-interaction --no-update \
            ${{ matrix.psr7 == 'nyholm' && 'guzzlehttp/psr7' || 'nyholm/psr7' }}
          composer update --no-interaction --prefer-dist

      - name: Contract suite (${{ matrix.psr7 }})
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/phpunit

      - name: PHPStan (max) over the package
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/phpstan analyse --no-progress
