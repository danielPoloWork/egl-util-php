name: ci

# Enterprise CI gate for egl-util-php, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on master (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for. The moment `composer.json` exists
  # every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the build system in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "composer.json" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::composer.json is not present yet, so the toolchain jobs are skipped. They start running by themselves once roadmap item 1.1 lands the build system."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: php-8.1, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.2, preset: default }
          - { os: ubuntu-24.04, toolchain: php-8.3, preset: default }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.toolchain == 'php-8.1' && '8.1' || matrix.toolchain == 'php-8.2' && '8.2' || '8.3' }}
          # No coverage driver here on purpose. This job never passed a --coverage flag, so pcov
          # was loaded and never used — overhead that also made the matrix *look* like it was
          # measuring a floor nothing compared (roadmap 2.7). Coverage is measured once, in the
          # `coverage` job below.
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build
        shell: bash
        run: composer install --optimize-autoloader

      - name: Test
        shell: bash
        run: vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The action-pin step resolves each version comment against its upstream repository, so it
    # needs the API. GITHUB_TOKEN is read-only here (`permissions: contents: read` above) and
    # only lifts the unauthenticated rate limit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py
      # ADR-0003's gate. Runs WITH --verify-upstream: the offline half only checks the pin
      # shape, and a version comment that lies is invisible to any purely local check when the
      # error is applied uniformly. CI is where the truthful half must run.
      - name: Enforce the CI action-pinning policy (ADR-0003)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/action_pin_lint.py --verify-upstream

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / cs-fixer + phpstan
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse
  hygiene:
    name: quality / composer normalize + audit
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.3' }
      - run: composer install --no-interaction --prefer-dist
      - run: composer normalize --dry-run
      - run: composer audit
  lowest-deps:
    name: quality / prefer-lowest install + test
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.1' }
      - run: composer update --no-interaction --prefer-lowest
      - run: vendor/bin/phpunit
  layering:
    # Self-enables when deptrac.yaml lands. hashFiles() is runner-only — it is NOT available
    # in a job-level `if` (startup failure on the whole workflow), so the config-presence
    # guard lives in a step.
    name: quality / deptrac layer rules
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for deptrac.yaml (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f deptrac.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3' }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - if: steps.cfg.outputs.present == 'true'
        run: vendor/bin/deptrac analyse
  # ---------------------------------------------------------------------------
  # Mutation score (roadmap 10.8, ADR-0040). Spec NFR-07 requires >= 70% MSI on the
  # Security/Database/Dto namespaces, and until item 10.8 nothing measured it: `infection.json5`
  # did not exist, so the config guard below reported `present=false` and this job passed in
  # seconds having run nothing — item 2.7's coverage-gate shape, a second time.
  #
  # Two further defects in the original step surfaced only by running it:
  #   - `vendor/bin/infection` never existed. Infection is NOT and cannot be a dependency of
  #     this package: every release from 0.29.10 on requires PHP ^8.2/^8.3 against this
  #     library's 8.1 floor, and the older 8.1-compatible releases conflict with versions this
  #     project already locks (justinrainbow/json-schema, fidry/cpu-core-counter,
  #     composer/xdebug-handler). Installed into a throwaway project instead, exactly as
  #     ADR-0031 does for the BC checker, so the 8.1 matrix cell and `--prefer-lowest` stay
  #     untouched.
  #   - `--only-covered` is not an Infection option (verified against 0.34.1's own `run`
  #     usage line). Uncovered code is excluded by default now; the inverse flag is
  #     `--with-uncovered`. The original line would have failed on argument parsing.
  #
  # The interpreter is 8.3 with pcov, matching the coverage job: mutation testing measures
  # test-suite strength, not runtime compatibility, so it does not need the 8.1 floor.
  # ---------------------------------------------------------------------------
  mutation:
    # Same step-level guard as `layering`: hashFiles() cannot gate a job-level `if`.
    name: quality / infection mutation score
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for infection.json5 (job self-enables when it lands)
        id: cfg
        run: echo "present=$([ -f infection.json5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.cfg.outputs.present == 'true'
        with: { php-version: '8.3', coverage: pcov }
      - if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Install Infection outside this package's dependency graph
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-tool"
          # Constrained rather than floating, for ADR-0031's reason: a tool that changes its
          # own findings between runs makes a quality gate unreviewable. `--no-plugins`
          # because infection/extension-installer would otherwise need an allow-plugins
          # prompt, and no Infection extensions are installed for it to register.
          composer require --working-dir="$RUNNER_TEMP/mutation-tool" \
            --no-interaction --no-plugins "infection/infection:^0.34"
      - name: Mutation score against NFR-07's 70% floor
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          php "$RUNNER_TEMP/mutation-tool/vendor/bin/infection" \
            --min-msi=70 --no-progress --no-interaction -j2
      - name: Keep the mutation report
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mutation-report
          path: build/logs/infection*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Coverage floor (roadmap 2.7, ADR-0007). AGENTS.md §10 and spec NFR-07 both require >= 90%
  # line coverage; PHPUnit 10 ships a dozen --fail-on-* switches and no coverage threshold among
  # them, so the comparison lives in tools/coverage_gate.py.
  #
  # Measured ONCE, on one interpreter, rather than per matrix cell: line coverage of this library
  # does not vary by PHP version, so three runs would be three identical numbers at three times
  # the cost. The build matrix proves the tests pass everywhere; this proves how much they reach.
  #
  # --coverage-text is deliberate alongside the machine-read report: it puts the number in the
  # log unconditionally, so a failure shows what the coverage actually was and not merely that a
  # threshold was missed.
  # ---------------------------------------------------------------------------
  coverage:
    name: quality / coverage floor
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: pcov
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - name: Measure coverage
        run: vendor/bin/phpunit --coverage-clover build/logs/clover.xml --coverage-text
      - name: Enforce the coverage floor (ADR-0007)
        run: python tools/coverage_gate.py build/logs/clover.xml --min 90

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  #
  # Self-enables when the phpbench harness lands (roadmap 3.5 / 7.1), via the same step-level
  # config guard as `layering` and `mutation`: hashFiles() is runner-only and cannot gate a
  # job-level `if` without failing the whole workflow at startup.
  #
  # The PHP setup below is written FOR THIS JOB rather than inherited from the build matrix.
  # The generated version injected the matrix's setup steps verbatim into a job that declares
  # no matrix, leaving two defects (roadmap 1.9):
  #   - `php-version: ${{ matrix.toolchain == 'php-8.1' && ... || '8.3' }}` — `matrix` is null
  #     here, so the ternary always fell through to '8.3'. Verified on run 30811447268: the job
  #     installed PHP 8.3.33. That happens to match the methodology below, which is worse than
  #     a visible error — it was right by accident, and would have silently selected the wrong
  #     interpreter the moment anyone gave this job a matrix.
  #   - `coverage: pcov` — coverage instrumentation distorts the very measurements this job
  #     exists to take.
  # Spec NFR-06 pins the benchmark interpreter to PHP 8.3; the rest of that methodology
  # (10 iterations x 100 revs, 5% retry threshold, OPcache + JIT off, >10% regression fails)
  # lands with the harness in roadmap item 7.1.
  # ---------------------------------------------------------------------------
  # Benchmarks (spec NFR-06). Two gates, because they catch different failures.
  #
  # `regression` compares HEAD against the base commit ON THE SAME RUNNER, which is what makes
  # NFR-06's 10% threshold usable. Measured before it was chosen: across nine master runs where
  # QueryBuilder and its benchmark were provably unchanged, one subject ranged 2.684-3.767us --
  # 40.4% peak to peak on GitHub's shared runners -- while five consecutive passes inside ONE job
  # spread 0.4-1.5%. A stored baseline at 10% would have fired on noise; a same-runner A/B gives
  # the threshold roughly six times the noise it must clear.
  #
  # `budgets` checks the absolute NFR ceilings, which the relative gate structurally cannot:
  # twenty commits at +9% each pass every regression check and still double the runtime.
  # ---------------------------------------------------------------------------
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline half needs a second commit to check out, so the default shallow
          # single-commit fetch is not enough.
          fetch-depth: 0
      - name: Check for a phpbench config (job self-enables when the harness lands)
        id: cfg
        shell: bash
        run: |
          if [ -f phpbench.json ] || [ -f phpbench.json.dist ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmarks pending::No phpbench config yet, so the benchmark suite is skipped."
          fi
      - name: Set up PHP
        if: steps.cfg.outputs.present == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'   # spec NFR-06 benchmark methodology — not the build matrix
          coverage: none       # instrumentation would distort the measurements
          # NFR-06 requires OPcache and JIT off. Asserted below rather than trusted.
          ini-values: opcache.enable_cli=0, opcache.jit=disable, opcache.jit_buffer_size=0
      - name: Assert the measurement environment matches NFR-06
        if: steps.cfg.outputs.present == 'true'
        run: php tools/assert_bench_env.php
      - name: Install dependencies
        if: steps.cfg.outputs.present == 'true'
        run: composer install --no-interaction --prefer-dist
      - name: Measure HEAD
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          mkdir -p build/logs
          vendor/bin/phpbench run --report=aggregate --dump-file=build/logs/head.xml
      - name: Absolute NFR budgets
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_budget_gate.py build/logs/head.xml             --budget benchHydrateWarm=5             --budget benchBuildFiveConditionSelect=10             --budget benchWarmSingletonResolve=2             --budget benchFirstAutowiredResolve=30             --budget benchSequenceNext=200             --budget benchWriteTenThousandByTen=150000             --budget benchDispatchLastOfFiftyRoutes=5             --budget benchEnvelopeBuild=2             --budget benchSuppressedRecord=0.5             --budget benchCryptoRoundTrip=60
      - name: NFR-01 ratio — hydration vs manual construction
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_ratio_gate.py build/logs/head.xml             --numerator benchHydrateWarm --denominator benchManualConstruction --max-ratio 3
      - name: NFR-09 ratio — gateway fetch+normalize+hydrate vs hand-written PDO
        if: steps.cfg.outputs.present == 'true'
        shell: bash
        run: |
          python3 tools/bench_ratio_gate.py build/logs/head.xml             --numerator benchGatewayFetchNormalizeHydrate --denominator benchHandWrittenPdoLoop --max-ratio 2.5
      - name: Resolve the base commit to compare against
        if: steps.cfg.outputs.present == 'true'
        id: base
        shell: bash
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::notice title=No baseline::No reachable base commit, so the regression gate has nothing to compare against. The absolute budgets above still ran."
          else
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure the base commit on this same runner
        if: steps.cfg.outputs.present == 'true' && steps.base.outputs.sha != ''
        shell: bash
        run: |
          git worktree add ../baseline "${{ steps.base.outputs.sha }}"
          cd ../baseline
          composer install --no-interaction --prefer-dist --quiet
          # Written back into the HEAD workspace so both reports sit side by side.
          vendor/bin/phpbench run --progress=none --dump-file="$GITHUB_WORKSPACE/build/logs/base.xml"
      - name: Regression gate — NFR-06's 10% budget
        if: steps.cfg.outputs.present == 'true' && steps.base.outputs.sha != ''
        shell: bash
        run: |
          python3 tools/bench_regression_gate.py build/logs/base.xml build/logs/head.xml \
            --max-regression 10 \
            --exclude "FileSequenceBench::benchSequenceNext" \
            --exclude "HashBench::benchMakeArgon2id" \
            --exclude "HashBench::benchVerifyArgon2id"
      - name: Keep the reports
        if: steps.cfg.outputs.present == 'true' && always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: benchmark-reports
          path: build/logs/*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Backward-compatibility gate (spec NFR-07, ADR-0031).
  #
  # Runs only on a **release PR**, which the imported spec §8 defines as the place this check
  # belongs. A release PR is detected mechanically — the PR changes `Version.php`'s VERSION
  # constant, which is step 1 of docs/workflow/release.md — rather than by a label, because a
  # label the maintainer forgets is a gate that silently does not run.
  #
  # Two things this job must not do:
  #
  # 1. **Fail before the first tag exists.** `roave/backward-compatibility-check` exits 1 with
  #    "Could not detect any released versions for the given repository" when a repo has no tags —
  #    verified. This one has none yet, and the first release PR is exactly when the check would
  #    first run. So it SKIPS on a declared condition and self-enables at the first `v*.*.*` tag
  #    (lesson L-0010).
  # 2. **Enter this package's dependency graph.** Every version from 8.7.0 requires PHP >= 8.2,
  #    later >= 8.3 and >= 8.4, while this library's floor is 8.1 — which is why
  #    `config.platform.php` is pinned to 8.1.34. Adding it as a dev dependency would either break
  #    the 8.1 matrix cell or abandon 8.1 support. It is installed into a throwaway project
  #    instead, so the tool can be modern while the library stays on its floor.
  # ---------------------------------------------------------------------------
  backward-compatibility:
    name: quality / backward compatibility
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and the base commit are both needed; the default shallow fetch has neither.
          fetch-depth: 0

      - name: Is this a release PR, and is there anything to compare against?
        id: scope
        shell: bash
        run: |
          CURRENT="$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/main/php/d4np/utils/Version.php)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          PREVIOUS="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

          BASE="${{ github.event.pull_request.base.sha }}"
          RELEASE_PR=false
          if [ -n "$BASE" ] && ! git diff --quiet "$BASE" HEAD -- src/main/php/d4np/utils/Version.php; then
            RELEASE_PR=true
          fi
          echo "release_pr=$RELEASE_PR" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_PR" != "true" ]; then
            echo "::notice title=Not a release PR::Version.php is unchanged, so the BC check does not apply. Spec NFR-07 places it on release PRs."
          elif [ -z "$PREVIOUS" ]; then
            echo "::notice title=No released version yet::This repository has no v*.*.* tag, and roave/backward-compatibility-check needs one to compare against. The gate self-enables at the first tag."
          else
            echo "::notice title=BC check will run::Comparing $PREVIOUS against $CURRENT."
          fi

      - name: Set up PHP
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The tool's own floor, not this library's. See the header comment.
          php-version: '8.3'
          coverage: none

      - name: Install the BC checker outside this package's dependency graph
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bc-tool"
          # Constrained rather than floating: an unpinned tool that changes its own findings between
          # runs makes a release gate unreviewable.
          composer require --working-dir="$RUNNER_TEMP/bc-tool" --no-interaction \
            "roave/backward-compatibility-check:^8.16"

      - name: Install this package's own dependencies
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        run: composer install --no-interaction --prefer-dist

      - name: Detect backward-incompatible changes since ${{ steps.scope.outputs.previous }}
        id: bc
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        shell: bash
        run: |
          set +e
          php "$RUNNER_TEMP/bc-tool/vendor/bin/roave-backward-compatibility-check" \
            --from="${{ steps.scope.outputs.previous }}" --format=markdown | tee bc-report.md
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "The checker exited $CODE (0 means no backward-incompatible change)."

      - name: Gate the findings against the version bump
        if: steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        shell: bash
        run: |
          python3 tools/bc_gate.py \
            --previous "${{ steps.scope.outputs.previous }}" \
            --current "${{ steps.scope.outputs.current }}" \
            --bc-exit "${{ steps.bc.outputs.code }}"

      - name: Keep the BC report
        if: always() && steps.scope.outputs.release_pr == 'true' && steps.scope.outputs.previous != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backward-compatibility-report
          path: bc-report.md
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The PSR-7 bridge's contract suite, in **PR mode** (ADR-0033, spec 02 §7).
  #
  # This is the property the monorepo topology was chosen for: the bridge is tested against the
  # core **in the working tree**, so a core change that breaks the conversion contract fails in the
  # pull request that introduces it — not later, in another repository's CI, after it merged.
  #
  # The path repository is injected into the CI **workspace only**. Committing it would point the
  # published package at `../../`, which exists nowhere outside this monorepo, and every standalone
  # install would fail while nothing here noticed. `BridgePackageBoundaryTest` in the core suite
  # asserts the committed manifest stays clean — verified: planting the injection fails 2 of its
  # tests.
  #
  # Self-enabling on the package's composer.json (lesson L-0010): item 8.1 ships the scaffold with
  # no converters and no contract suite, so until 8.2 lands there is nothing to run. The job says
  # so in a notice rather than passing silently, because a skip and a pass look identical on a
  # green tick.
  # ---------------------------------------------------------------------------
  bridge-contract:
    name: quality / PSR-7 bridge contract
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both PSR-17 implementations spec 02 §7 requires: one alone would let the contract
        # silently encode that vendor's leniencies.
        psr7: [nyholm, guzzle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Does the bridge package have anything to run yet?
        id: pkg
        shell: bash
        run: |
          if [ ! -f packages/utils-psr7-bridge/composer.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bridge package absent::packages/utils-psr7-bridge/composer.json does not exist, so there is nothing to test. This job enables itself when the package lands."
            exit 0
          fi
          if [ -z "$(find packages/utils-psr7-bridge/src/test -name '*Test.php' -print -quit 2>/dev/null)" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bridge contract suite pending::The package scaffold exists but carries no tests yet. The T-B conversion suite lands with roadmap item 8.2; this job runs it from then on."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.pkg.outputs.ready == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The package's own floor. The bridge must not narrow the core's, and the core supports 8.1.
          php-version: '8.1'
          coverage: none

      - name: Resolve the core from the working tree (workspace only — never committed)
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/utils-psr7-bridge
        run: |
          composer config repositories.monorepo path ../../
          composer require "egl/utils:@dev" --no-update --no-interaction
          composer update --no-interaction --prefer-dist

      - name: Prove the core really came from this checkout
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/utils-psr7-bridge
        shell: bash
        run: |
          # Without this, a resolution that quietly fell back to a published egl/utils would make
          # the whole same-PR guarantee a fiction while every test still passed.
          TYPE="$(php -r '$l=json_decode(file_get_contents("composer.lock"),true); foreach($l["packages"] as $p){ if($p["name"]==="egl/utils"){ echo $p["dist"]["type"] ?? ($p["source"]["type"] ?? "?"); } }')"
          echo "egl/utils resolved as: $TYPE"
          if [ "$TYPE" != "path" ]; then
            echo "::error title=Core not from the working tree::egl/utils resolved as '$TYPE', not 'path'. The bridge would be tested against a published core instead of the code in this PR, which is the entire property ADR-0033 chose the monorepo for."
            exit 1
          fi

      - name: Pin the PSR-17 implementation under test
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/utils-psr7-bridge
        run: |
          composer remove --dev --no-interaction --no-update \
            ${{ matrix.psr7 == 'nyholm' && 'guzzlehttp/psr7' || 'nyholm/psr7' }}
          composer update --no-interaction --prefer-dist

      - name: Contract suite (${{ matrix.psr7 }})
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/utils-psr7-bridge
        run: vendor/bin/phpunit

      - name: PHPStan (max) over the package
        if: steps.pkg.outputs.ready == 'true'
        working-directory: packages/utils-psr7-bridge
        run: vendor/bin/phpstan analyse --no-progress
